# Tracked Ruff configuration for the public reference repository.
# The local (untracked) pyproject.toml uses a much stricter rule set; this
# published config keeps the checks that catch real defects (syntax errors,
# undefined names, unused imports/variables, import order, whitespace) while
# not requiring docstrings on every test method or demo helper.

target-version = "py310"
# Aligns with config/quality_gates.json: 99 columns is the enforced line length.
line-length = 99

[lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E731", "E741"]  # local lambdas in plot scripts; single-letter grid indices
